spring:
  application:
    name: microservicio-productos
  data:
    mongodb:
      uri: mongodb://localhost:27017/productos_db
      auto-index-creation: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
